name: ci

on:
  pull_request:
    branches:
      - trunk

env:
  ZIG_VERSION: "0.14.0"

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: mlugg/setup-zig@v1
      with:
        version: ${{ env.ZIG_VERSION }}
    - name: Check zig is canonical
      shell: bash
      run: |
        zig fmt --check .
  build:
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - windows-2022
        profile:
          - 'zig build'
          - 'zig build -Ddev'
          - 'zig build -Dturbo'
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Setup Zig
      uses: mlugg/setup-zig@v1
      with:
        version: ${{ env.ZIG_VERSION }}

    - name: Build
      run: ${{ matrix.profile }}
