<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>spaceporn</title>
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
            color: #eee;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: fixed;
            image-rendering: pixelated;
        }

        #info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            color: #bbb;
            font-size: 14px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        </style>
        <script src="main.js"></script>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div id="info">
            <div id="status">Loading</div>
            <div id="fps"></div>
        </div>
    </body>
</html>
